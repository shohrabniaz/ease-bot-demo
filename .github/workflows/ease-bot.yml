name: EASE-Bot
on:
  pull_request:
    paths: ["**/*.tf", "**/*.yaml", "**/*.yml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ease-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shohrabniaz/ease-bot@v0.1.1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
